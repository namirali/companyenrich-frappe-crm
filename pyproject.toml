[project]
name = "companyenrich_crm"
version = "0.1.0"
description = "CompanyEnrich company and people research for Frappe CRM"
authors = [{name = "CompanyEnrich"}]
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = ["requests>=2.28,<3", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9", "build"]

[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
crm = ">=1.91.1,<2.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
